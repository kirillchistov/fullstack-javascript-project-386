# Blueprint для деплоя на Render (https://render.com/docs/blueprint-spec).
# Render собирает образ по Dockerfile и передаёт приложению порт через PORT.
# SQLite-файл живёт в контейнере (на free-плане без диска данные сбрасываются
# при редеплое — для продакшена позже нужен persistent disk или Postgres).
services:
  - type: web
    name: call-calendar
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/public/kirill
    envVars:
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_EMAIL
        value: owner@example.com
      - key: OWNER_NAME
        value: Кирилл Чистов
      - key: OWNER_SLUG
        value: kirill
      - key: OWNER_TIMEZONE
        value: Europe/Moscow
      - key: DATABASE_PATH
        value: /app/data/call-calendar.sqlite
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
