openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.3.0
  description: |-
    Call Calendar — сервис «Запись на звонок».

    API-контракт (Design First): этот файл и соседние .tsp — единственный
    источник истины. Из них компилируется docs/api/openapi.yaml, по которому
    независимо реализуются бэкенд (Fastify) и фронтенд (React).

    Сценарии:
    - Гость: открывает /u/{slug}, смотрит типы событий и свободные слоты
    (в своей таймзоне на фронтенде), бронирует звонок.
    - Владелец: регистрируется, входит, управляет типами событий и доступностью,
    смотрит и отменяет предстоящие встречи.
tags:
  - name: Owners
  - name: Session
  - name: Guest
  - name: Owner
paths:
  /api/availability:
    get:
      operationId: AvailabilityRoutes_getAvailability
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Owner
      security:
        - ApiKeyAuth: []
    put:
      operationId: AvailabilityRoutes_updateAvailability
      description: |-
        Полная замена настроек доступности.
        Правила и интервалы исключений кратны 15 минутам и не пересекаются в рамках дня.
        Перерыв = два правила в один weekday с разрывом между ними.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Availability'
      security:
        - ApiKeyAuth: []
  /api/bookings:
    get:
      operationId: OwnerBookingRoutes_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Owner
      security:
        - ApiKeyAuth: []
  /api/bookings/{id}:
    delete:
      operationId: OwnerBookingRoutes_cancel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Owner
      security:
        - ApiKeyAuth: []
  /api/event-types:
    get:
      operationId: OwnerEventTypeRoutes_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Owner
      security:
        - ApiKeyAuth: []
    post:
      operationId: OwnerEventTypeRoutes_create
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeWrite'
      security:
        - ApiKeyAuth: []
  /api/event-types/{id}:
    put:
      operationId: OwnerEventTypeRoutes_update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeWrite'
      security:
        - ApiKeyAuth: []
    delete:
      operationId: OwnerEventTypeRoutes_remove
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Owner
      security:
        - ApiKeyAuth: []
  /api/guest/bookings/{token}:
    get:
      operationId: GuestBookingRoutes_get
      description: Карточка встречи по секретной ссылке
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestBooking'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Guest
    delete:
      operationId: GuestBookingRoutes_cancel
      description: Отмена встречи гостем
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Guest
    patch:
      operationId: GuestBookingRoutes_reschedule
      description: |-
        Перенос на другой свободный слот того же типа события.
        409 — новый слот недоступен.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestBooking'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: '409 — конфликт: слот уже занят или находится в прошлом'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingReschedule'
  /api/notification-settings:
    get:
      operationId: NotificationSettingsRoutes_get
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Owner
      security:
        - ApiKeyAuth: []
    put:
      operationId: NotificationSettingsRoutes_update
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationSettings'
      security:
        - ApiKeyAuth: []
  /api/owners:
    post:
      operationId: OwnerRoutes_register
      description: |-
        Регистрация нового владельца календаря.
        При успехе устанавливается сессионная cookie (как при входе).
        409 — email или slug уже заняты.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '409':
          description: 409 — email или slug уже заняты при регистрации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlreadyExistsError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Owners
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerCreate'
  /api/public/{slug}:
    get:
      operationId: PublicRoutes_getOwner
      description: Публичный профиль владельца для страницы /u/{slug}
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerPublic'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Guest
  /api/public/{slug}/bookings:
    post:
      operationId: PublicRoutes_createBooking
      description: |-
        Гость создаёт бронирование. В ответе — manageToken для отмены/переноса.
        409 — слот занят с учётом буфера, в прошлом, вне расписания или за горизонтом.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreated'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: '409 — конфликт: слот уже занят или находится в прошлом'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
  /api/public/{slug}/event-types:
    get:
      operationId: PublicRoutes_listEventTypes
      description: Типы событий этого владельца
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
      tags:
        - Guest
  /api/public/{slug}/slots:
    get:
      operationId: PublicRoutes_listSlots
      description: |-
        Свободные слоты за период [from, to] для выбранного типа события.
        Учитываются буфер между встречами и исключения (праздники/отпуск).
        Длина слота = durationMinutes типа. Горизонт — 14 дней включая сегодня.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: eventTypeId
          in: query
          required: true
          schema:
            type: integer
            format: int32
          explode: false
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Slot'
        '404':
          description: 404 — ресурс не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Guest
  /api/session:
    post:
      operationId: SessionRoutes_login
      description: Вход владельца. Устанавливает сессионную cookie.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
    get:
      operationId: SessionRoutes_current
      description: Текущая сессия (проверка «я залогинен?»)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
      tags:
        - Session
      security:
        - ApiKeyAuth: []
    delete:
      operationId: SessionRoutes_logout
      description: Выход владельца. Удаляет сессию.
      parameters: []
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
      tags:
        - Session
      security:
        - ApiKeyAuth: []
components:
  schemas:
    AlreadyExistsError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - already_exists
        message:
          type: string
      description: 409 — email или slug уже заняты при регистрации
    Availability:
      type: object
      required:
        - timezone
        - bufferMinutes
        - rules
        - exceptions
      properties:
        timezone:
          type: string
          description: Часовой пояс владельца, IANA-идентификатор (например, Europe/Moscow)
        bufferMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 120
          description: |-
            Буфер до и после каждой активной встречи (минуты, кратно 15).
            В это время новые слоты не предлагаются.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityRule'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityException'
          description: Праздники, отпуска и разовые переопределения дней
      description: Настройки доступности владельца
      example:
        timezone: Europe/Moscow
        bufferMinutes: 15
        rules:
          - weekday: 1
            startTime: '10:00'
            endTime: '13:00'
          - weekday: 1
            startTime: '14:00'
            endTime: '18:00'
        exceptions:
          - date: '2026-01-01'
            intervals: []
    AvailabilityException:
      type: object
      required:
        - date
        - intervals
      properties:
        date:
          type: string
          format: date
          description: Дата YYYY-MM-DD в календаре владельца
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/DayInterval'
          description: Рабочие интервалы в этот день; [] = выходной
      description: |-
        Исключение из недельного расписания на конкретную дату
        (праздник, отпуск, особый день приёма).
        Пустой `intervals` — день полностью недоступен.
    AvailabilityRule:
      type: object
      required:
        - weekday
        - startTime
        - endTime
      properties:
        weekday:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
          description: 'День недели по ISO 8601: 1 — понедельник … 7 — воскресенье'
        startTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Начало интервала, локальное время владельца в формате HH:MM
        endTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Конец интервала, локальное время владельца в формате HH:MM
      description: |-
        Правило доступности: повторяющийся недельный интервал,
        в котором владелец готов принимать звонки (например, Пн 10:00–18:00).
        Перерыв внутри дня = два непересекающихся правила в один weekday.
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - startsAt
        - endsAt
        - guestName
        - guestEmail
        - status
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        eventTypeId:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          format: email
        comment:
          type: string
          description: Комментарий гостя владельцу (тема звонка и т. п.)
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time
      description: Бронирование для владельца (без секретного токена гостя)
      example:
        id: 1
        eventTypeId: 1
        startsAt: '2026-07-27T10:00:00Z'
        endsAt: '2026-07-27T10:30:00Z'
        guestName: Иван Петров
        guestEmail: ivan@example.com
        comment: Хочу обсудить проект
        status: active
        createdAt: '2026-07-21T12:00:00Z'
    BookingCreate:
      type: object
      required:
        - eventTypeId
        - startsAt
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
          description: Начало выбранного слота, UTC. Должно совпадать со слотом из GET …/slots.
        guestName:
          type: string
          minLength: 1
        guestEmail:
          type: string
          format: email
        comment:
          type: string
      description: Данные для создания бронирования гостем
    BookingCreated:
      type: object
      required:
        - id
        - eventTypeId
        - startsAt
        - endsAt
        - guestName
        - guestEmail
        - status
        - createdAt
        - manageToken
      properties:
        id:
          type: integer
          format: int32
        eventTypeId:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          format: email
        comment:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatus'
        createdAt:
          type: string
          format: date-time
        manageToken:
          type: string
          description: Секретный токен управления встречей гостем
      description: |-
        Ответ при создании брони: обычные поля + секретный токен
        для отмены/переноса гостем (ссылка /b/{manageToken}).
    BookingReschedule:
      type: object
      required:
        - startsAt
      properties:
        startsAt:
          type: string
          format: date-time
      description: Перенос встречи гостем на другой свободный слот того же типа
    BookingStatus:
      type: string
      enum:
        - active
        - cancelled
    ConflictError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - slot_unavailable
        message:
          type: string
      description: '409 — конфликт: слот уже занят или находится в прошлом'
    DayInterval:
      type: object
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        endTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      description: Интервал времени в пределах одного календарного дня (локальное время владельца)
    EventType:
      type: object
      required:
        - id
        - name
        - durationMinutes
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          description: |-
            Длительность встречи в минутах: 15–240, кратно 15.
            От неё зависят длина слота и шаг сетки при вычислении свободного времени.
      description: Тип события — то, на что гость записывается (например, «Вводный звонок»)
      example:
        id: 1
        name: Вводный звонок
        description: Знакомство и обсуждение задачи
        durationMinutes: 30
    EventTypeWrite:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
      description: Создание / обновление типа события владельцем
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
      description: Ошибка одного поля при валидации
    GuestBooking:
      type: object
      required:
        - id
        - eventTypeName
        - durationMinutes
        - ownerName
        - ownerSlug
        - ownerTimezone
        - startsAt
        - endsAt
        - guestName
        - guestEmail
        - status
      properties:
        id:
          type: integer
          format: int32
        eventTypeName:
          type: string
        durationMinutes:
          type: integer
          format: int32
        ownerName:
          type: string
        ownerSlug:
          type: string
        ownerTimezone:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          format: email
        comment:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatus'
      description: Карточка встречи для гостя по секретному токену
    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - not_found
        message:
          type: string
      description: 404 — ресурс не найден
    NotificationSettings:
      type: object
      required:
        - emailEnabled
        - reminderHoursBefore
      properties:
        emailEnabled:
          type: boolean
          description: Письма о новых / отменённых / перенесённых встречах и напоминания
        telegramChatId:
          type: string
          description: |-
            Chat id Telegram для уведомлений владельцу.
            Пустая строка / отсутствие — Telegram выключен.
        reminderHoursBefore:
          type: integer
          format: int32
          minimum: 1
          maximum: 168
          description: За сколько часов до встречи слать напоминание гостю и владельцу (1–168)
      description: Настройки уведомлений владельца
    Owner:
      type: object
      required:
        - id
        - name
        - email
        - slug
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          description: Отображаемое имя, показывается гостю на странице бронирования
        email:
          type: string
          format: email
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
          description: |-
            Публичный идентификатор в URL: латиница, цифры, дефис;
            2–32 символа, начинается и заканчивается буквой или цифрой.
      description: |-
        Владелец календаря. Создаётся через регистрацию; публичная страница —
        /u/{slug} на фронтенде и /api/public/{slug} в API.
      example:
        id: 1
        name: Кирилл Чистов
        email: owner@example.com
        slug: kirill
    OwnerCreate:
      type: object
      required:
        - name
        - email
        - password
        - slug
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
      description: Данные регистрации нового владельца
    OwnerPublic:
      type: object
      required:
        - id
        - name
        - slug
        - timezone
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
          description: IANA-таймзона владельца (в ней заданы правила доступности)
      description: Публичный профиль владельца для гостевой страницы бронирования
      example:
        id: 1
        name: Кирилл Чистов
        slug: kirill
        timezone: Europe/Moscow
    Session:
      type: object
      required:
        - owner
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
      description: Активная сессия
    SessionCreate:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      description: Учётные данные владельца для входа
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
          description: Начало слота, UTC
        endsAt:
          type: string
          format: date-time
          description: Конец слота, UTC (startsAt + durationMinutes типа события)
      description: |-
        Свободный слот. Вычисляется на лету из правил доступности и длительности
        выбранного типа события за вычетом активных бронирований — в базе не хранится.
      example:
        startsAt: '2026-07-27T10:00:00Z'
        endsAt: '2026-07-27T10:30:00Z'
    UnauthorizedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - unauthorized
        message:
          type: string
      description: 401 — нет активной сессии владельца или неверные учётные данные
    ValidationError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation_error
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      description: 422 — ошибка валидации входных данных
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: session
servers:
  - url: http://localhost:5001
    description: Локальный сервер разработки
    variables: {}
