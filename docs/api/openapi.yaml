openapi: 3.0.0
info:
  title: Call Calendar API
  version: 0.4.0
  description: |-
    Call Calendar — сервис «Запись на звонок».

    API-контракт (Design First): этот файл и соседние .tsp — единственный
    источник истины. Из них компилируется docs/api/openapi.yaml, по которому
    независимо реализуются бэкенд (Fastify) и фронтенд (React).

    Сценарии:
    - Гость: открывает /u/{slug}, смотрит типы событий и свободные слоты
    (в своей таймзоне на фронтенде), бронирует звонок.
    - Владелец: регистрируется, входит, управляет типами событий и доступностью,
    смотрит и отменяет предстоящие встречи; Pro — sync, команда, серии, аналитика.
tags:
  - name: Owners
  - name: Session
  - name: Guest
  - name: Owner
  - name: Payments
paths:
  /api/analytics:
    get:
      operationId: AnalyticsRoutes_summary
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
        '401':
          description: 401 — нет активной сессии владельца или неверные учётные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: 403 — нужна подписка Pro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '422':
          description: 422 — ошибка валидации входных данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
      tags:
        - Owner
      security:
        - ApiKeyAuth: []
