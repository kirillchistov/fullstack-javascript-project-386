components:
  schemas:
    ActivatePro:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          minLength: 1
          description: |-
            Код активации. Совпадает с BILLING_PRO_CODE или "pro-dev"
            в development без переменной.
      description: Ручная активация Pro (заглушка подписки)
    AlreadyExistsError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - already_exists
        message:
          type: string
      description: 409 — email или slug уже заняты при регистрации
    AnalyticsSummary:
      type: object
      required:
        - from
        - to
        - created
        - cancelled
        - upcoming
        - byWeekday
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        created:
          type: integer
          format: int32
        cancelled:
          type: integer
          format: int32
        upcoming:
          type: integer
          format: int32
          description: Активные будущие на момент запроса
        byWeekday:
          type: array
          items:
            type: integer
            format: int32
          description: Число броней по ISO-дню недели 1..7
    Availability:
      type: object
      required:
        - timezone
        - bufferMinutes
        - rules
        - exceptions
      properties:
        timezone:
          type: string
          description: Часовой пояс владельца, IANA-идентификатор (например, Europe/Moscow)
        bufferMinutes:
          type: integer
          format: int32
          minimum: 0
          maximum: 120
          description: |-
            Буфер до и после каждой активной встречи (минуты, кратно 15).
            В это время новые слоты не предлагаются.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityRule'
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityException'
          description: Праздники, отпуска и разовые переопределения дней
      description: Настройки доступности владельца
      example:
        timezone: Europe/Moscow
        bufferMinutes: 15
        rules:
          - weekday: 1
            startTime: '10:00'
            endTime: '13:00'
          - weekday: 1
            startTime: '14:00'
            endTime: '18:00'
        exceptions:
          - date: '2026-01-01'
            intervals: []
    AvailabilityException:
      type: object
      required:
        - date
        - intervals
      properties:
        date:
          type: string
          format: date
          description: Дата YYYY-MM-DD в календаре владельца
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/DayInterval'
          description: Рабочие интервалы в этот день; [] = выходной
      description: |-
        Исключение из недельного расписания на конкретную дату
        (праздник, отпуск, особый день приёма).
        Пустой `intervals` — день полностью недоступен.
    AvailabilityRule:
      type: object
      required:
        - weekday
        - startTime
        - endTime
      properties:
        weekday:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
          description: 'День недели по ISO 8601: 1 — понедельник … 7 — воскресенье'
        startTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Начало интервала, локальное время владельца в формате HH:MM
        endTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Конец интервала, локальное время владельца в формате HH:MM
      description: |-
        Правило доступности: повторяющийся недельный интервал,
        в котором владелец готов принимать звонки (например, Пн 10:00–18:00).
        Перерыв внутри дня = два непересекающихся правила в один weekday.
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - eventTypeName
        - startsAt
        - endsAt
        - guestName
        - guestEmail
        - status
        - paymentStatus
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        eventTypeId:
          type: integer
          format: int32
        eventTypeName:
          type: string
          description: Название типа события на момент ответа (для списков владельца)
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          format: email
        comment:
          type: string
          description: Комментарий гостя владельцу (тема звонка и т. п.)
        status:
          $ref: '#/components/schemas/BookingStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          type: string
          format: date-time
      description: Бронирование для владельца (без секретного токена гостя)
      example:
        id: 1
        eventTypeId: 1
        eventTypeName: Вводный звонок
        startsAt: '2026-07-27T10:00:00Z'
        endsAt: '2026-07-27T10:30:00Z'
        guestName: Иван Петров
        guestEmail: ivan@example.com
        comment: Хочу обсудить проект
        status: active
        paymentStatus: none
        createdAt: '2026-07-21T12:00:00Z'
    BookingCreate:
      type: object
      required:
        - eventTypeId
        - startsAt
        - guestName
        - guestEmail
      properties:
        eventTypeId:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
          description: Начало выбранного слота, UTC. Должно совпадать со слотом из GET …/slots.
        guestName:
          type: string
          minLength: 1
        guestEmail:
          type: string
          format: email
        comment:
          type: string
      description: Данные для создания бронирования гостем
    BookingCreated:
      type: object
      required:
        - id
        - eventTypeId
        - startsAt
        - endsAt
        - guestName
        - guestEmail
        - status
        - paymentStatus
        - createdAt
        - manageToken
      properties:
        id:
          type: integer
          format: int32
        eventTypeId:
          type: integer
          format: int32
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          format: email
        comment:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          type: string
          format: date-time
        manageToken:
          type: string
          description: Секретный токен управления встречей гостем
        paymentUrl:
          type: string
          description: URL оплаты, если тип события платный и статус pending
      description: |-
        Ответ при создании брони: обычные поля + секретный токен
        для отмены/переноса гостем (ссылка /b/{manageToken}).
    BookingReschedule:
      type: object
      required:
        - startsAt
      properties:
        startsAt:
          type: string
          format: date-time
      description: Перенос встречи гостем на другой свободный слот того же типа
    BookingSeries:
      type: object
      required:
        - id
        - eventTypeId
        - guestName
        - guestEmail
        - startsAt
        - count
        - bookingIds
      properties:
        id:
          type: integer
          format: int32
        eventTypeId:
          type: integer
          format: int32
        guestName:
          type: string
        guestEmail:
          type: string
          format: email
        comment:
          type: string
        startsAt:
          type: string
          format: date-time
          description: Первый старт серии, UTC
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 52
          description: Число встреч в серии (1–52)
        bookingIds:
          type: array
          items:
            type: integer
            format: int32
          description: Созданные брони (id)
      description: Серия повторяющихся встреч (тьютор ↔ ученик), еженедельно
    BookingSeriesCreate:
      type: object
      required:
        - eventTypeId
        - guestName
        - guestEmail
        - startsAt
        - count
      properties:
        eventTypeId:
          type: integer
          format: int32
        guestName:
          type: string
          minLength: 1
        guestEmail:
          type: string
          format: email
        comment:
          type: string
        startsAt:
          type: string
          format: date-time
        count:
          type: integer
          format: int32
          minimum: 1
          maximum: 52
    BookingStatus:
      type: string
      enum:
        - active
        - cancelled
    CalendarConnection:
      type: object
      required:
        - id
        - kind
        - label
      properties:
        id:
          type: integer
          format: int32
        kind:
          $ref: '#/components/schemas/CalendarConnectionKind'
        label:
          type: string
          description: Для ICS — URL; для Google — email календаря или "primary"
        lastSyncedAt:
          type: string
          format: date-time
      description: Подключённый источник занятости (busy)
    CalendarConnectionKind:
      type: string
      enum:
        - google
        - ics
    ConflictError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - slot_unavailable
        message:
          type: string
      description: '409 — конфликт: слот уже занят или находится в прошлом'
    DayInterval:
      type: object
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        endTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
      description: Интервал времени в пределах одного календарного дня (локальное время владельца)
    EventType:
      type: object
      required:
        - id
        - name
        - durationMinutes
        - priceRub
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
          description: |-
            Длительность встречи в минутах: 15–240, кратно 15.
            От неё зависят длина слота и шаг сетки при вычислении свободного времени.
        priceRub:
          type: integer
          format: int32
          minimum: 0
          description: Цена в рублях; 0 — бесплатно
      description: Тип события — то, на что гость записывается (например, «Вводный звонок»)
      example:
        id: 1
        name: Вводный звонок
        description: Знакомство и обсуждение задачи
        durationMinutes: 30
        priceRub: 0
    EventTypeWrite:
      type: object
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        durationMinutes:
          type: integer
          format: int32
          minimum: 15
          maximum: 240
        priceRub:
          type: integer
          format: int32
          minimum: 0
      description: Создание / обновление типа события владельцем
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string
      description: Ошибка одного поля при валидации
    ForbiddenError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - forbidden
        message:
          type: string
      description: 403 — нужна подписка Pro
    GoogleAuthStart:
      type: object
      required:
        - authUrl
      properties:
        authUrl:
          type: string
          description: URL для OAuth-редиректа пользователя в Google
    GuestBooking:
      type: object
      required:
        - id
        - eventTypeName
        - durationMinutes
        - ownerName
        - ownerSlug
        - ownerTimezone
        - startsAt
        - endsAt
        - guestName
        - guestEmail
        - status
        - paymentStatus
      properties:
        id:
          type: integer
          format: int32
        eventTypeName:
          type: string
        durationMinutes:
          type: integer
          format: int32
        ownerName:
          type: string
        ownerSlug:
          type: string
        ownerTimezone:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        guestName:
          type: string
        guestEmail:
          type: string
          format: email
        comment:
          type: string
        status:
          $ref: '#/components/schemas/BookingStatus'
        paymentStatus:
          $ref: '#/components/schemas/PaymentStatus'
      description: Карточка встречи для гостя по секретному токену
    IcsConnectionCreate:
      type: object
      required:
        - url
        - label
      properties:
        url:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - not_found
        message:
          type: string
      description: 404 — ресурс не найден
    NotificationSettings:
      type: object
      required:
        - emailEnabled
        - reminderHoursBefore
      properties:
        emailEnabled:
          type: boolean
          description: Письма о новых / отменённых / перенесённых встречах и напоминания
        telegramChatId:
          type: string
          description: |-
            Chat id Telegram для уведомлений владельцу.
            Пустая строка / отсутствие — Telegram выключен.
        reminderHoursBefore:
          type: integer
          format: int32
          minimum: 1
          maximum: 168
          description: За сколько часов до встречи слать напоминание гостю и владельцу (1–168)
      description: Настройки уведомлений владельца
    OrgRole:
      type: string
      enum:
        - owner
        - member
    Organization:
      type: object
      required:
        - id
        - name
        - ownerId
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        ownerId:
          type: integer
          format: int32
          description: Владелец-создатель организации
    OrganizationCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
    OrganizationInvite:
      type: object
      required:
        - token
        - joinPath
      properties:
        token:
          type: string
        joinPath:
          type: string
          description: Ссылка для принявшего приглашение (фронт /team/join?token=)
    OrganizationInviteCreate:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    OrganizationJoin:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
    OrganizationMember:
      type: object
      required:
        - ownerId
        - name
        - email
        - slug
        - role
      properties:
        ownerId:
          type: integer
          format: int32
        name:
          type: string
        email:
          type: string
        slug:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
    Owner:
      type: object
      required:
        - id
        - name
        - email
        - slug
        - plan
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
          description: Отображаемое имя, показывается гостю на странице бронирования
        email:
          type: string
          format: email
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
          description: |-
            Публичный идентификатор в URL: латиница, цифры, дефис;
            2–32 символа, начинается и заканчивается буквой или цифрой.
        plan:
          allOf:
            - $ref: '#/components/schemas/Plan'
          description: 'Тариф: free или pro (команда, sync, аналитика, серии)'
      description: |-
        Владелец календаря. Создаётся через регистрацию; публичная страница —
        /u/{slug} на фронтенде и /api/public/{slug} в API.
      example:
        id: 1
        name: Кирилл Чистов
        email: owner@example.com
        slug: kirill
        plan: free
    OwnerCreate:
      type: object
      required:
        - name
        - email
        - password
        - slug
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
      description: Данные регистрации нового владельца
    OwnerPublic:
      type: object
      required:
        - id
        - name
        - slug
        - timezone
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        slug:
          type: string
        timezone:
          type: string
          description: IANA-таймзона владельца (в ней заданы правила доступности)
      description: Публичный профиль владельца для гостевой страницы бронирования
      example:
        id: 1
        name: Кирилл Чистов
        slug: kirill
        timezone: Europe/Moscow
    PaymentInfo:
      type: object
      required:
        - id
        - bookingId
        - amountRub
        - status
        - confirmationUrl
      properties:
        id:
          type: integer
          format: int32
        bookingId:
          type: integer
          format: int32
        amountRub:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/PaymentStatus'
        confirmationUrl:
          type: string
          description: URL оплаты (YooKassa или stub)
    PaymentStatus:
      type: string
      enum:
        - none
        - pending
        - paid
        - failed
    Plan:
      type: string
      enum:
        - free
        - pro
    Session:
      type: object
      required:
        - owner
      properties:
        owner:
          $ref: '#/components/schemas/Owner'
      description: Активная сессия
    SessionCreate:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      description: Учётные данные владельца для входа
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
          description: Начало слота, UTC
        endsAt:
          type: string
          format: date-time
          description: Конец слота, UTC (startsAt + durationMinutes типа события)
      description: |-
        Свободный слот. Вычисляется на лету из правил доступности и длительности
        выбранного типа события за вычетом активных бронирований — в базе не хранится.
      example:
        startsAt: '2026-07-27T10:00:00Z'
        endsAt: '2026-07-27T10:30:00Z'
    UnauthorizedError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - unauthorized
        message:
          type: string
      description: 401 — нет активной сессии владельца или неверные учётные данные
    ValidationError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - validation_error
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      description: 422 — ошибка валидации входных данных
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: cookie
      name: session
servers:
  - url: http://localhost:5001
    description: Локальный сервер разработки
    variables: {}
